name: Suggest a correction
description: Point out a wrong number, an outdated fact or a broken source on a card.
title: "Correction: "
labels: ["correction"]
body:
  - type: input
    id: card
    attributes:
      label: Card link
      description: Filled in automatically when you come from a card.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong?
      description: Quote the sentence or figure.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source for the correction
      description: A link to a primary or reputable source, please.
    validations:
      required: true
  - type: markdown
    attributes:
      value: "Everything you write here is public on GitHub. Please do not include personal data."
